services:
  kino-db:
    image: docker.io/library/postgres:16-alpine
    container_name: kino_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - kino_db_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"
    networks:
      - kino-network

  kino-app:
    container_name: kino_web_server
    restart: always
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@kino-db:5432/${POSTGRES_DB}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      - kino-db
    networks:
      - kino-network

volumes:
  kino_db_data:

networks:
  kino-network:
    driver: bridge
